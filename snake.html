<!DOCTYPE html>
<html>
<head>
    <title>Mini Snake Game</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        canvas { border: 1px solid #000; background: white; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let direction = 'right';
        let score = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw food
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * box, food.y * box, box, box);
            // Draw snake
            ctx.fillStyle = 'green';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * box, snake[i].y * box, box, box);
            }
            // Draw score
            ctx.fillStyle = 'black';
            ctx.font = '16px Arial';
            ctx.fillText('Score: ' + score, 10, 20);
        }

        function update() {
            const head = {x: snake[0].x, y: snake[0].y};
            if (direction === 'right') head.x++;
            else if (direction === 'left') head.x--;
            else if (direction === 'up') head.y--;
            else if (direction === 'down') head.y++;

            if (head.x < 0 || head.x >= canvas.width/box || head.y < 0 || head.y >= canvas.height/box) {
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                food = {x: Math.floor(Math.random() * (canvas.width/box)), y: Math.floor(Math.random() * (canvas.height/box))};
            } else {
                snake.pop();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowUp' && direction !== 'down') direction = 'up';
            else if (e.key === 'ArrowDown' && direction !== 'up') direction = 'down';
            else if (e.key === 'ArrowLeft' && direction !== 'right') direction = 'left';
            else if (e.key === 'ArrowRight' && direction !== 'left') direction = 'right';
        });

        loop();
    </script>
</body>
</html>
